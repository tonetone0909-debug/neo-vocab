<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEO TOEFL · 모의고사</title>
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="stylesheet" href="../assets/colors_and_type.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .free-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--neo-acid,#E8FF3A);
    border-bottom:3px solid var(--neo-ink,#0A0A0A);padding:6px 12px;position:sticky;top:0;z-index:40}
  .free-tag{font-family:var(--font-mono,monospace);font-size:11px;font-weight:700;
    background:var(--neo-ink,#0A0A0A);color:var(--neo-paper,#FBFBF7);padding:2px 8px;margin-right:4px}
  .free-jump{font-size:12px;font-weight:700;border:2px solid var(--neo-ink,#0A0A0A);background:#fff;padding:3px 9px;cursor:pointer}
  .free-jump:hover{background:var(--neo-ink,#0A0A0A);color:#fff}
  .free-reset{margin-left:auto;font-size:12px;font-weight:700;border:2px solid var(--neo-ink,#0A0A0A);
    background:var(--neo-hot,#FF3DA6);color:#fff;padding:3px 11px;cursor:pointer}

  /* ---- 채점 중 로딩 화면 (Speaking 종료 후) ---- */
  body.grading-open .exam-topbar,
  body.grading-open .subbar,
  body.grading-open .free-bar{display:none !important;}
  .grading-wrap{min-height:82vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .grading-card{background:var(--neo-card,#fff);border:3px solid var(--neo-ink,#0A0A0A);
    box-shadow:8px 8px 0 var(--neo-ink,#0A0A0A);padding:40px 30px;max-width:460px;width:100%;text-align:center;}
  .grading-kicker{font-family:var(--font-mono,monospace);font-size:11px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;background:var(--neo-ink,#0A0A0A);color:var(--neo-paper,#FBFBF7);padding:5px 11px;display:inline-block;}
  .grading-dots{display:flex;gap:12px;justify-content:center;margin:26px 0 24px;}
  .grading-dots i{width:24px;height:24px;display:block;border:3px solid var(--neo-ink,#0A0A0A);
    background:var(--neo-card,#fff);animation:gpop 1.05s infinite ease-in-out;}
  .grading-dots i:nth-child(2){animation-delay:.13s;}
  .grading-dots i:nth-child(3){animation-delay:.26s;}
  .grading-dots i:nth-child(4){animation-delay:.39s;}
  @keyframes gpop{0%,70%,100%{transform:translateY(0);background:var(--neo-card,#fff);}
    35%{transform:translateY(-16px);background:var(--neo-acid,#E8FF3A);}}
  .grading-title{font-family:var(--font-title-kr,'Noto Sans KR'),sans-serif;font-weight:900;
    font-size:clamp(28px,5.4vw,42px);line-height:1.1;letter-spacing:-0.025em;
    text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;}
  .grading-title .en{font-family:'Archivo Black',sans-serif;}
  /* 순환하는 진행 문구 — 페이드로 바뀐다. min-height 로 글자수 달라도 안 흔들림. */
  .grading-sub{font-size:15.5px;font-weight:700;color:var(--neo-ink,#0A0A0A);line-height:1.6;
    margin-top:14px;min-height:23px;transition:opacity .22s ease;}
  .grading-bar{height:12px;border:3px solid var(--neo-ink,#0A0A0A);margin-top:24px;overflow:hidden;background:var(--neo-paper,#FBFBF7);}
  .grading-bar span{display:block;height:100%;width:40%;background:var(--neo-blaze,#2B2BFF);animation:gslide 1.4s infinite ease-in-out;}
  @keyframes gslide{0%{margin-left:-40%;}100%{margin-left:100%;}}
</style>
<script src="assets/mobile-guard.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/shell.js"></script>
</head>
<body class="exam-body">

<!-- 시험 화면은 .exam-topbar 를 쓴다. shell.js 는 .app-topbar / .topbar 에만
     이름칩을 붙이므로 여기엔 안 붙는다 — 시험 중엔 타이머·진행률만 보여야 한다.
     shell.js 자체는 로드한다(우클릭 차단 등 공통 동작 때문). -->
<div class="exam-topbar">
  <div class="brand"><span class="n">NEO</span><span>TOEFL</span>
    <span style="opacity:.5">·</span><span id="hd-set">MOCK</span></div>
  <div id="vol-slot"></div>
  <div class="session" id="hd-who"></div>
  <div class="timer" id="hd-timer">--:--</div>
  <button class="pill" id="btn-review">Review</button>
  <button class="pill" id="btn-pause">Pause</button>
</div>

<!-- 좌측 = 문항 번호, 우측 = 이동 버튼. 섹션 탭은 두지 않는다
     (실제 시험에도 없고, 시험 중엔 지금 문항에만 집중하면 된다) -->
<div class="subbar" id="subbar">
  <span class="qnum" id="qnum"></span>
  <div class="nav">
    <button class="btn" id="btn-prev">Previous</button>
    <button class="btn btn-next" id="btn-next">Next</button>
  </div>
</div>

<div id="stage"></div>

<!-- 엔진·렌더러가 먼저 정의돼야 아래 부팅 스크립트가 참조할 수 있다 -->
<script src="assets/volume.js"></script>
<script src="assets/examdb.js"></script>
<script src="assets/score.js"></script>
<script src="assets/intro.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/render-r.js"></script>
<script src="assets/render-l.js"></script>
<script src="assets/render-w.js"></script>
<script src="assets/render-s.js"></script>
<script src="assets/feedback-io.js"></script>

<script>
(function () {
  "use strict";
  if (window.NEO_MOBILE && NEO_MOBILE.guard()) return;   // 폰이면 여기서 차단

  var qs = new URLSearchParams(location.search);
  var SET = parseInt(qs.get("set") || "1", 10);
  var stage = document.getElementById("stage");
  var timerEl = document.getElementById("hd-timer");
  var qnumEl = document.getElementById("qnum");
  var prevBtn = document.getElementById("btn-prev");
  var nextBtn = document.getElementById("btn-next");
  var reviewBtn = document.getElementById("btn-review");
  var pauseBtn = document.getElementById("btn-pause");
  var subbar = document.getElementById("subbar");   // 설명 화면에서 잠시 감춘다
  var eng = null;

  // 사운드체크처럼 엔진이 아직 없는 화면에서 진행바 Next 로 넘어가기 위한 훅.
  var pendingNext = null;
  prevBtn.addEventListener("click", function () { if (eng) eng.go(-1); });
  nextBtn.addEventListener("click", function () {
    if (typeof pendingNext === "function") { var f = pendingNext; pendingNext = null; f(); return; }
    if (!eng) return;
    if (nextBtn.dataset.submit === "1") submitNow();
    else eng.go(1);
  });

  /* 시험 중 화면 확대·축소 차단.
   * 배율이 바뀌면 지문 분량과 레이아웃이 학생마다 달라져 조건이 흐트러진다.
   * Ctrl+휠 / Ctrl +,-,0 / 트랙패드 핀치(Safari gesture) 세 경로를 모두 막는다.
   * 브라우저 메뉴로 하는 확대는 막을 방법이 없다 — 그건 페이지 권한 밖이다. */
  window.addEventListener("wheel", function (e) {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });
  window.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) &&
        ["+", "-", "=", "0", "_"].indexOf(e.key) >= 0) {
      e.preventDefault();
    }
  });
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    window.addEventListener(t, function (e) { e.preventDefault(); });
  });

  function code() {
    return sessionStorage.getItem("neo_code") || localStorage.getItem("neo_code") || "";
  }
  /* 자유 모드: 강사(admin 역할) 또는 지정 코드. 시간 무제한 + 섹션 자유이동 + 언제든 리셋. */
  var FREE_CODES = ["랍슨4355"];
  function isFree() {
    return sessionStorage.getItem("neo_role") === "admin" || FREE_CODES.indexOf(code()) >= 0;
  }
  function el(t, c, x) {
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x !== undefined) e.textContent = x;
    return e;
  }
  function mmss(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" +
           String(s % 60).padStart(2, "0");
  }

  NEO_VOL.mount(document.getElementById("vol-slot"));
  document.getElementById("hd-set").textContent = "MOCK " + SET;
  document.getElementById("hd-who").textContent =
    (code() || "").replace(/\s*\d{4}$/, "");

  /* 데이터는 세트별로 하나만 읽는다. 시험 중엔 key(정답·해설)를 로드하지만
     화면에는 절대 내보내지 않는다 — 라우팅 판정에만 쓴다. */
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = function () { rej(src); };
      document.head.appendChild(s);
    });
  }

  /* ---------- 진행 표시 ---------- */
  function paint(info) {
    // Speaking 은 문항별 RESPONSE TIME 으로 굴러가서 상단 섹션 타이머가 의미 없다 → 숨긴다.
    noTimer = (info.sec === "S");
    if (noTimer) setTimer(null);
    // Complete the Words 는 한 화면이 10문항이라 번호가 범위로 나온다
    // ("QUESTION 1-10 of 20"). 객관식은 단일 번호 ("QUESTION 11 of 20").
    var n = info.nums[info.cursor];
    qnumEl.textContent = n
      ? "QUESTION " + (n.from === n.to ? n.from : n.from + "-" + n.to) +
        " of " + info.secTotal
      : "";
    // Listening 은 되돌아갈 수 없다 — 오디오를 다시 들을 수 없으니 앞 문항으로
    // 돌아가는 게 의미가 없고, 실제 시험도 그렇다.
    // Speaking 은 재생->녹음->다음 이 자동이라 이동 버튼 자체가 없다.
    var auto = info.sec === "S";
    prevBtn.style.display = (info.sec === "L" || auto) ? "none" : "";
    // Speaking 은 자동 진행이라 Next 를 숨기지만, 강사 자유 모드에선 수동 이동용으로 노출한다.
    nextBtn.style.display = (auto && !isFree()) ? "none" : "";
    // Writing 은 태스크 경계를 뒤로 넘을 수 없다 (앞 태스크의 남은 시간을 다시 쓰지 못하게)
    prevBtn.disabled = !info.canBack;
    // 마지막 화면에서는 Next 가 곧 제출이다. 별도 제출 버튼을 두면
    // 학생이 Next 를 눌러도 아무 일이 없어 막힌 것으로 오해한다.
    var last = info.cursor >= info.total - 1;
    nextBtn.disabled = false;
    // 리스닝: 정답을 고르거나 시간이 다 되기 전엔 수동으로 다음으로 못 넘어간다.
    // (시간초과 시엔 engine.nextQ 가 자동 이동하므로 버튼 게이트는 '조기 스킵'만 막는다.
    //  setAnswer 가 매번 onPhase→paint 를 다시 부르므로 정답을 고르면 즉시 활성화된다.)
    if (info.sec === "L" && eng) {
      var pcur = eng.progress()[info.cursor];
      if (pcur && !pcur.answered) nextBtn.disabled = true;
    }
    nextBtn.textContent = last ? "Submit" : "Next";
    nextBtn.dataset.submit = last ? "1" : "";
    /* Review 는 '앞뒤로 오갈 수 있는 구간' 에서만 의미가 있다.
       Listening 은 되돌아갈 수 없고(오디오 1회 재생), Speaking 은 자동 진행이라
       뺀다. Writing 은 Task 1(Build a Sentence)만 문항이 여러 개라 그때만 둔다. */
    var canReview = info.sec === "R" || (info.sec === "W" && info.gt === "bas");
    reviewBtn.style.display = canReview ? "" : "none";
    // pause 는 시간이 흐르는 문항 화면엔 두지 않는다(시계를 멈춰 유리해지는 걸 방지).
    // 각 영역 시작 전·모듈 전환의 설명(인트로) 화면이 곧 쉬는 지점 — 시간이 안 흐르고 Next 로만 진행한다.
    pauseBtn.style.display = "none";
  }

  var noTimer = false;   // 이 섹션은 타이머 자체가 없다(Speaking = 문항별 구동)
  function setTimer(text) {
    // 시간이 흐르지 않으면 타이머를 아예 감춘다(공간은 유지해 레이아웃이 안 흔들리게).
    if (text === null) { timerEl.style.visibility = "hidden"; }
    else { timerEl.style.visibility = "visible"; timerEl.textContent = text; }
  }
  function tick(ms, budget) {
    // Speaking·자유모드·시간 미흐름(인트로/리스닝 오디오 중)이면 타이머 없음.
    if (noTimer || (eng && eng.free) || ms === null || ms === undefined) { setTimer(null); return; }
    setTimer(mmss(ms));
  }

  /* 타이머 없는 '진행바 Next 로만 넘어가는' 화면(사운드체크·인트로)의 공용 크롬 설정. */
  function configSubbar() {
    setTimer(null); qnumEl.textContent = "";
    prevBtn.style.display = "none"; reviewBtn.style.display = "none"; pauseBtn.style.display = "none";
    nextBtn.style.display = ""; nextBtn.disabled = false; nextBtn.textContent = "Next"; nextBtn.dataset.submit = "";
  }

  /* **굵게** 만 지원한다. 설명 문구에 필요한 강조가 이것뿐이고,
     innerHTML 을 통째로 받으면 데이터가 곧 스크립트가 된다. */
  function rich(tag, cls, text) {
    var n = el(tag, cls);
    String(text).split(/\*\*/).forEach(function (part, i) {
      if (!part) return;
      if (i % 2) n.appendChild(el("b", null, part));
      else n.appendChild(document.createTextNode(part));
    });
    return n;
  }

  function introTable(t) {
    var tb = el("table", "intro-table" + (t.tone ? " tone-" + t.tone : ""));
    if (t.head) {
      var tr = el("tr");
      t.head.forEach(function (h) { tr.appendChild(el("th", null, h)); });
      tb.appendChild(tr);
    }
    (t.rows || []).forEach(function (row) {
      var r = el("tr");
      row.forEach(function (c, i) {
        r.appendChild(rich("td", i === 0 ? "td-k" : null, c));
      });
      tb.appendChild(r);
    });
    return tb;
  }

  /* ---------- 일시정지 ----------
     남은 시간을 얼려 두고 화면을 가린다. 문항이 보이면 멈춘 동안 읽을 수 있어
     정지가 곧 부정행위가 된다. */
  function showPause() {
    if (!eng) return;
    eng.pause();
    var ov = el("div", "overlay");
    var box = el("div", "overlay-box");
    box.appendChild(el("div", "ov-k", "PAUSED"));
    box.appendChild(el("h2", "ov-t", "Your test is paused"));
    box.appendChild(el("p", "ov-p",
      "The timer is stopped and your answers are saved. " +
      "Questions are hidden while paused."));
    var go = el("button", "btn btn-next", "Resume");
    go.addEventListener("click", function () {
      ov.remove();
      eng.resume();
    });
    box.appendChild(go);
    ov.appendChild(box);
    document.body.appendChild(ov);
  }
  pauseBtn.addEventListener("click", showPause);

  /* ---------- Review ----------
     이 모듈의 문항을 한눈에 보여주고 바로 이동한다. 응답 여부만 알려주고
     정답 여부는 알려주지 않는다 — 시험 중이다. */
  function showReview() {
    if (!eng) return;
    var rows = eng.progress();
    var ov = el("div", "overlay");
    var box = el("div", "overlay-box rv-box");
    box.appendChild(el("div", "ov-k", "REVIEW"));
    box.appendChild(el("h2", "ov-t", "Questions in this module"));

    var left = rows.filter(function (r) { return !r.answered; }).length;
    box.appendChild(el("p", "ov-p", left
      ? left + " of " + rows.length + " not answered yet."
      : "All " + rows.length + " questions answered."));

    var grid = el("div", "ov-grid");
    rows.forEach(function (r) {
      var b = el("button", "ov-cell " + (r.answered ? "on" : "off"));
      var label = r.num
        ? (r.num.from === r.num.to ? r.num.from : r.num.from + "-" + r.num.to)
        : (r.cursor + 1);
      b.appendChild(el("span", "ov-n", label));
      b.appendChild(el("span", "ov-s", r.answered ? "ANSWERED" : "NOT ANSWERED"));
      b.addEventListener("click", function () {
        ov.remove();
        eng.jump(r.cursor);
      });
      grid.appendChild(b);
    });
    box.appendChild(grid);

    var close = el("button", "btn", "Close");
    close.addEventListener("click", function () { ov.remove(); });
    box.appendChild(close);
    ov.appendChild(box);
    document.body.appendChild(ov);
  }
  reviewBtn.addEventListener("click", showReview);

  /* ---------- 단계 설명 화면 ----------
     내용은 data/intro.js 가 들고 있다. 여러 장이면 '다음'으로 넘기고
     마지막 장에서 '시작'을 누르면 그때 타이머가 돈다(engine.begin). */
  function showIntro(info, pages, done) {
    document.body.classList.add("intro-open");
    configSubbar();   // 진행바 Next 로만 진행(공용)

    var i = 0;
    function page() {
      var p = pages[i];
      stage.innerHTML = "";
      var box = el("div", "intro");
      if (p.kicker) box.appendChild(el("div", "intro-kicker", p.kicker));
      if (p.title) box.appendChild(el("h1", "intro-title", p.title));
      (p.body || []).forEach(function (t) {
        box.appendChild(rich("p", "intro-body", t));
      });
      if (p.table) box.appendChild(introTable(p.table));
      if (p.list && p.list.length) {
        var ul = el("ul", "intro-list");
        p.list.forEach(function (t) { ul.appendChild(rich("li", null, t)); });
        box.appendChild(ul);
      }
      if (p.note) box.appendChild(rich("div", "intro-note", p.note));
      stage.appendChild(box);

      // 자체 Next 버튼·페이지 점(dots) 없음 — 진행바 Next 로 다음 페이지/시작.
      var last = i === pages.length - 1;
      pendingNext = function () {
        if (last) { document.body.classList.remove("intro-open"); done(); }
        else { i++; page(); }
      };
    }
    page();
  }

  /* ---------- 환경 준비 ----------
     게이트 화면을 없앴으므로 여기서 처리한다.
     - 코덱 감지: 제스처가 필요 없다. 페이지 로드 때 해둔다.
     - 오디오 언락: **사용자 제스처 안에서만** 된다(iOS·모바일 크롬).
       설명 화면의 Next 가 첫 제스처라 거기서 열린다. 설명이 없는 경우까지
       대비해 문서 전체의 첫 클릭·키 입력에도 한 번 걸어 둔다. */
  (function detectMime() {
    var mimes = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
    var mime = "";
    if (window.MediaRecorder) {
      for (var i = 0; i < mimes.length; i++) {
        if (MediaRecorder.isTypeSupported(mimes[i])) { mime = mimes[i]; break; }
      }
    }
    window.NEO_MOCK_MIME = mime;
  })();

  function unlockAudio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ac = window.__neoAC || (window.__neoAC = new Ctx());
      if (ac.state === "suspended") ac.resume();
      var o = ac.createOscillator(), gn = ac.createGain();
      gn.gain.value = 0.0001;              // 들리지 않는 무음 — 언락 목적
      o.connect(gn); gn.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.02);
    } catch (e) {}
  }
  ["pointerdown", "keydown"].forEach(function (t) {
    document.addEventListener(t, unlockAudio, { once: true });
  });

  /* ---------- 사운드 체크 ----------
     시험 전에 소리와 마이크를 확인한다. Speaking 도중에 마이크가 안 되는 걸
     알게 되는 게 최악이라 권한 요청도 여기서 끝낸다.
     이 화면은 시험 시간에 포함되지 않는다(엔진은 Continue 후에 시작한다). */
  function soundCheck(done) {
    var sample = new Audio("audio/soundcheck.mp3");
    NEO_VOL.apply(sample);
    // 마이크 판정 파라미터/상태(2페이지)
    // 정상 말소리로도 초록이 되게 감도를 높임(게인↑, 초록 진입 문턱↓, 상한↑).
    var GAIN = 2.6, BASE_LOW = 0.18, HIGH = 0.94, OVER_FLOOR = 0.10, CAL_FRAMES = 45, NEED = 70;
    var mediaStream = null, raf = null, okFrames = 0, passed = false;
    var meter, zoneLow, zoneOk, zoneHigh, needle, mNote, retryBtn;

    function stopMic() {
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      if (mediaStream) { mediaStream.getTracks().forEach(function (t) { t.stop(); }); mediaStream = null; }
    }

    /* ===== 1페이지: 볼륨 ===== */
    function volumePage() {
      stopMic();
      var g = el("div", "gate sound-check");
      g.appendChild(el("h1", null, "Volume Check"));
      g.appendChild(el("p", "lead",
        "Please wear headphones. You will listen to audio and record your voice during this test."));
      var vc = el("div", "card");
      vc.appendChild(el("h2", null, "Volume"));
      vc.appendChild(el("p", "sc-p",
        "Use the volume icon at the top of the screen to set a comfortable level. Play the sample to check."));
      var vNote = el("div", "sc-note", "");
      var vBtn = el("button", "btn", "Play sample");
      vBtn.addEventListener("click", function () {
        sample.currentTime = 0;
        var p = sample.play();
        vBtn.disabled = true; vNote.textContent = "Playing…";
        if (p && p.catch) p.catch(function () {
          vBtn.disabled = false; vNote.textContent = "Could not play audio. Check your browser settings.";
        });
      });
      sample.onended = function () {
        vBtn.disabled = false; vBtn.textContent = "Play again";
        vNote.textContent = "Adjust the volume, then play again to check.";
      };
      sample.onerror = function () { vBtn.disabled = true; vNote.textContent = "Sample audio could not be loaded."; };
      vc.appendChild(vBtn); vc.appendChild(vNote);
      g.appendChild(vc);
      stage.innerHTML = ""; stage.appendChild(g);
      configSubbar();
      pendingNext = function () { sample.pause(); micPage(); };   // Next → 마이크 페이지
    }

    /* ===== 2페이지: 마이크 (진입 즉시 권한 요청) ===== */
    function micPage() {
      sample.pause();
      passed = false; okFrames = 0;
      var g = el("div", "gate sound-check");
      g.appendChild(el("h1", null, "Microphone Check"));
      g.appendChild(el("p", "lead", "Allow microphone access, then read the sentence out loud."));
      var mc = el("div", "card");
      mc.appendChild(el("h2", null, "Microphone"));
      mc.appendChild(el("p", "sc-p", "Repeat the following sentence:"));
      mc.appendChild(el("blockquote", "sc-say", "Describe the city you live in."));
      meter = el("div", "meter");
      zoneLow = el("div", "mz mz-low"); zoneOk = el("div", "mz mz-ok");
      zoneHigh = el("div", "mz mz-high"); needle = el("div", "m-needle");
      meter.appendChild(zoneLow); meter.appendChild(zoneOk);
      meter.appendChild(zoneHigh); meter.appendChild(needle);
      mc.appendChild(meter);
      var legend = el("div", "m-legend");
      [["mz-low", "Too quiet"], ["mz-ok", "Good"], ["mz-high", "Too loud"]].forEach(function (r) {
        var it = el("span", "m-li");
        it.appendChild(el("i", r[0])); it.appendChild(document.createTextNode(r[1]));
        legend.appendChild(it);
      });
      mc.appendChild(legend);
      mNote = el("div", "sc-note", "");
      retryBtn = el("button", "btn", "Try again");   // 권한 거부 시에만 노출
      retryBtn.style.display = "none";
      retryBtn.addEventListener("click", runMic);
      mc.appendChild(mNote); mc.appendChild(retryBtn);
      g.appendChild(mc);
      stage.innerHTML = ""; stage.appendChild(g);
      configSubbar();
      pendingNext = function () { stopMic(); unlockAudio(); done(); };   // Next → 시험 시작
      runMic();   // ★ 진입 즉시 마이크 권한 요청(이 시점은 볼륨 Next 클릭의 사용자 제스처 안)
    }

    /* 감도: 주변 소음을 먼저 재고 그 기준선 위로 올라와야 초록으로 본다. */
    function runMic() {
      if (!window.NEO_MOCK_MIME) { mNote.textContent = "Recording is not supported in this browser."; return; }
      retryBtn.style.display = "none";
      mNote.textContent = "Requesting microphone…";
      passed = false; okFrames = 0;
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (st) {
        mediaStream = st;
        mNote.textContent = "Measuring background noise… stay quiet.";
        var Ctx = window.AudioContext || window.webkitAudioContext;
        var ac = window.__neoAC || (window.__neoAC = new Ctx());
        if (ac.state === "suspended") ac.resume();
        var src = ac.createMediaStreamSource(st);
        var an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
        var buf = new Uint8Array(an.fftSize);
        var calN = 0, calSum = 0, low = BASE_LOW;
        (function frame() {
          an.getByteTimeDomainData(buf);
          var sum = 0;
          for (var i = 0; i < buf.length; i++) { var d = (buf[i] - 128) / 128; sum += d * d; }
          var rms = Math.sqrt(sum / buf.length);
          var lvl = Math.min(1, rms * GAIN);
          if (calN < CAL_FRAMES) {
            calN++; calSum += lvl;
            mNote.textContent = "Measuring background noise… stay quiet.";
            needle.style.left = (lvl * 100) + "%"; meter.className = "meter at-low";
            raf = requestAnimationFrame(frame); return;
          }
          if (calN === CAL_FRAMES) {
            calN++;
            low = Math.max(BASE_LOW, calSum / CAL_FRAMES + OVER_FLOOR);
            zoneLow.style.width = (low * 100) + "%";
            zoneOk.style.width = ((HIGH - low) * 100) + "%";
            zoneHigh.style.width = ((1 - HIGH) * 100) + "%";
            mNote.textContent = "Now read the sentence out loud.";
          }
          needle.style.left = (lvl * 100) + "%";
          meter.className = "meter " + (lvl < low ? "at-low" : lvl < HIGH ? "at-ok" : "at-high");
          if (!passed) {
            okFrames = (lvl >= low && lvl < HIGH) ? okFrames + 1 : 0;
            if (okFrames >= NEED) { passed = true; stopMic(); mNote.textContent = "Microphone looks good. Press Next to start."; }
          }
          if (!passed) raf = requestAnimationFrame(frame);
        })();
      }).catch(function () {
        mNote.textContent = "Microphone permission was denied. Allow it in your browser settings, then try again.";
        retryBtn.style.display = "";
      });
    }

    volumePage();
  }

  /* ---------- AI 자동 채점 (Writing 은 Speaking 중에 미리, Speaking 은 종료 후) ---------- */
  var GRADE_BASE = (window.NEO_GRADER && NEO_GRADER.url)
    ? NEO_GRADER.url.replace(/\/+$/, "") : "http://localhost:8788";
  var GRADE_ENDPOINT = GRADE_BASE + "/grade";
  var wGrade = null, wStarted = false, gradingTimer = null;

  /* Writing 파트가 끝나면(=Speaking 시작) 곧바로 백그라운드 채점을 건다. */
  function startWritingGrade() {
    if (wStarted || !eng) return;
    wStarted = true;
    try {
      wGrade = NEO_FBIO.buildBundle(EXAM, KEY, { answers: eng.answers() }, code(), SET, "W")
        .then(function (b) { return b.length ? NEO_FBIO.gradeRemote(b, GRADE_ENDPOINT, code(), SET) : {}; })
        .catch(function () { return null; });
    } catch (e) { wGrade = Promise.resolve(null); }
  }

  /* 채점 중 로딩 화면. */
  function showGrading() {
    document.body.classList.add("grading-open");
    timerEl.textContent = "";
    stage.innerHTML = "";
    var w = el("div", "grading-wrap");
    var card = el("div", "grading-card");
    card.appendChild(el("div", "grading-kicker", "AI 첨삭 중"));
    var dots = el("div", "grading-dots");
    for (var i = 0; i < 4; i++) dots.appendChild(el("i"));
    card.appendChild(dots);
    card.appendChild(el("h1", "grading-title", "채점하고 있어요"));
    var sub = el("p", "grading-sub");
    card.appendChild(sub);
    var bar = el("div", "grading-bar"); bar.appendChild(el("span")); card.appendChild(bar);
    w.appendChild(card);
    stage.appendChild(w);
    // 진행 문구 순환(페이드)
    var MSGS = ["답안 불러오는 중", "Speaking 전사본 생성 중", "피드백 생성 중", "점수 합산 중"];
    var mi = 0; sub.textContent = MSGS[0];
    gradingTimer = setInterval(function () {
      mi = (mi + 1) % MSGS.length;
      sub.style.opacity = "0";
      setTimeout(function () { sub.textContent = MSGS[mi]; sub.style.opacity = "1"; }, 220);
    }, 1900);
  }

  /* Speaking 종료 → 로딩 표시 → (Writing 결과 + Speaking 채점) 모두 완료 후 리포트로. */
  function finishFlow(detail) {
    showGrading();
    if (!isFree()) postDetail(detail);    // objective 결과 서버 저장(어드민 풀 리포트용)
    if (!wStarted) startWritingGrade();   // 자유모드 점프 등으로 W가 아직이면 지금 건다
    var sGrade = NEO_FBIO.buildBundle(EXAM, KEY, detail, code(), SET, "S")
      .then(function (b) { return b.length ? NEO_FBIO.gradeRemote(b, GRADE_ENDPOINT, code(), SET) : {}; })
      .catch(function () { return null; });

    var done = false;
    function go() {
      if (gradingTimer) { clearInterval(gradingTimer); gradingTimer = null; }
      location.replace("report.html?set=" + SET);
    }
    // 서버 다운·과부하로 무한 대기하지 않도록 안전 타임아웃 후에도 리포트로 이동.
    var timer = setTimeout(function () { if (!done) { done = true; go(); } }, 180000);

    Promise.all([wGrade || Promise.resolve(null), sGrade]).then(function (arr) {
      if (done) return; done = true; clearTimeout(timer);
      var fb = {};
      (arr || []).forEach(function (part) { if (part) for (var k in part) fb[k] = part[k]; });
      var save = (Object.keys(fb).length && NEO_EXAMDB.putFeedback)
        ? NEO_EXAMDB.putFeedback(code(), SET, fb).catch(function () {}) : Promise.resolve();
      save.then(go);
    }).catch(function () { if (!done) { done = true; clearTimeout(timer); go(); } });
  }

  /* ---------- 전체화면 안내 (Volume Check 앞) ---------- */
  function fullscreenTip(done) {
    stage.innerHTML = "";
    var g = el("div", "gate sound-check");
    g.appendChild(el("h1", null, "전체화면 권장"));
    g.appendChild(el("p", "lead", "F11을 눌러 전체화면 모드에서 진행하면 훨씬 편해요."));
    var row = el("div", "fs-actions");
    row.style.cssText = "display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap";
    var fs = el("button", "btn btn-next", "전체화면으로 시작");
    fs.addEventListener("click", function () {
      try {
        var d = document.documentElement;
        var req = d.requestFullscreen || d.webkitRequestFullscreen || d.msRequestFullscreen;
        if (req) { var r = req.call(d); if (r && r.catch) r.catch(function () {}); }
      } catch (e) {}
      done();
    });
    var plain = el("button", "btn", "그냥 시작");
    plain.addEventListener("click", done);
    row.appendChild(fs); row.appendChild(plain);
    g.appendChild(row);
    stage.appendChild(g);
    configSubbar();      // 하단 진행바 Next 도 '시작'으로 동작
    pendingNext = done;
  }

  /* objective 결과(R/L 밴드·총점 등)를 서버에도 저장 → 어드민이 풀 리포트를 조회할 수 있게.
   * best-effort(실패해도 로컬 흐름 무영향). 강사 자유모드는 실데이터 오염 방지로 제외. */
  function postDetail(detail) {
    try {
      fetch(GRADE_BASE + "/detail?code=" + encodeURIComponent(code()) + "&set=" + SET, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(detail), keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }

  /* ---------- 부팅 ---------- */
  function boot() {
    eng = new NEO_ENGINE({
      exam: window.EXAM, key: window.KEY, code: code(), host: stage,
      free: isFree(),
      onPhase: paint, onTick: tick, onIntro: showIntro,
      onSubmit: function (k) { if (k === "W.all") startWritingGrade(); },
      onFinish: function (res, detail) { finishFlow(detail); }
    });
    if (isFree()) installFreeBar();
    eng.start();
  }

  /* 강사 자유 모드 컨트롤바: 섹션 자유이동 + 언제든 리셋 */
  function installFreeBar() {
    var LAB = ["Reading M1", "Reading M2", "Listening M1", "Listening M2", "Writing", "Speaking"];
    var bar = el("div", "free-bar");
    bar.appendChild(el("span", "free-tag", "강사 자유 모드"));
    (window.NEO_ENGINE.FLOW || []).forEach(function (f, i) {
      var b = el("button", "free-jump", LAB[i] || (f.sec + "." + f.stage));
      b.addEventListener("click", function () { if (eng) eng.jumpTo(i); });
      bar.appendChild(b);
    });
    var rs = el("button", "free-reset", "리셋");
    rs.addEventListener("click", function () {
      askConfirm("이 세트를 리셋할까요?",
        "답안·녹음·진행이 모두 지워지고 처음부터 다시 시작해요.", "리셋", function () {
          NEO_EXAMDB.wipeSet(code(), SET).then(function () { location.reload(); })
            .catch(function () { location.reload(); });
        });
    });
    bar.appendChild(rs);
    var tb = document.querySelector(".exam-topbar");
    tb.parentNode.insertBefore(bar, tb.nextSibling);
  }

  /* 확인 대화상자. 브라우저 기본 confirm() 은 디자인 시스템과 따로 놀고
     모바일에서 주소창까지 흔들려서, Pause·Review 와 같은 오버레이로 만든다. */
  function askConfirm(title, msg, okText, onOk) {
    var ov = el("div", "overlay");
    var box = el("div", "overlay-box");
    box.appendChild(el("div", "ov-k", "CONFIRM"));
    box.appendChild(el("h2", "ov-t", title));
    box.appendChild(el("p", "ov-p", msg));
    var row = el("div", "ov-actions");
    var no = el("button", "btn", "Cancel");
    var yes = el("button", "btn btn-next", okText);
    no.addEventListener("click", function () { ov.remove(); });
    yes.addEventListener("click", function () { ov.remove(); onOk(); });
    row.appendChild(no); row.appendChild(yes);
    box.appendChild(row);
    ov.appendChild(box);
    document.body.appendChild(ov);
    yes.focus();
  }

  function submitNow() {
    if (!eng) return;
    var info = eng.info();
    var name = { R: "Reading", L: "Listening", W: "Writing", S: "Speaking" }[info.sec];
    var part = info.stage === "s1" ? " Module 1"
             : info.stage === "s2" ? " Module 2" : "";
    askConfirm("Submit " + name + part + "?",
               "You cannot return to this part after submitting.",
               "Submit", function () { eng.submitPhase(false); });
  }

  /* 모의고사 접근 게이트 — 배정된 코드(또는 admin·상시허용)만 응시. URL 직접 진입도 막는다. */
  function mockAllowed() {
    var admin = false; try { admin = sessionStorage.getItem("neo_role") === "admin"; } catch (e) {}
    if (admin || ["랍슨4355", "사랑0624", "마리6789"].indexOf(code()) >= 0) return Promise.resolve(true);
    var want = String(SET);   // 이 세트가 배정돼 있어야 응시 가능
    function cachedHas() {    // 서버 실패 시에만 폴백
      try { if (sessionStorage.getItem("neo_mock_code") === code()) return (sessionStorage.getItem("neo_mock_sets") || "").split(",").indexOf(want) >= 0; } catch (e) {}
      return false;
    }
    var g = (window.NEO_GRADER && NEO_GRADER.url) ? NEO_GRADER.url.replace(/\/+$/, "") : "";
    if (!g || !code()) return Promise.resolve(cachedHas());
    // 항상 서버에서 최신 배정 확인(해제 즉시 반영). 실패 시에만 캐시 폴백.
    return fetch(g + "/mock-allowed?code=" + encodeURIComponent(code()), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var sets = ((d && d.sets) || []).map(String);
        try { sessionStorage.setItem("neo_mock_code", code()); sessionStorage.setItem("neo_mock_sets", sets.join(",")); } catch (e) {}
        return sets.indexOf(want) >= 0;
      })
      .catch(function () { return cachedHas(); });
  }
  function blockedGate() {
    stage.innerHTML = "";
    var g = el("div", "gate");
    g.appendChild(el("h1", null, "접근 권한이 없어요"));
    g.appendChild(el("p", "lead", "모의고사는 선생님이 배정해야 응시할 수 있어요. 배정을 요청해 주세요."));
    var a = el("a", "btn", "← 홈으로"); a.href = "../index.html"; g.appendChild(a);
    stage.appendChild(g);
  }
  mockAllowed().then(function (allowed) {
    if (!allowed) { blockedGate(); return; }
  return Promise.all([
    loadScript("data/mk" + SET + "_exam.js"),
    loadScript("data/mk" + SET + "_key.js")
  ]).then(function () {
    window.EXAM = window["NEO_DATA_MK" + SET + "_EXAM"];
    window.KEY = window["NEO_DATA_MK" + SET + "_KEY"];
    if (!window.EXAM) throw new Error("no data");
    return NEO_EXAMDB.getDetail(code(), SET);
  }).then(function (done) {
    // 이미 응시를 마쳤으면 시험 화면에 못 들어온다. 리포트로 보낸다.
    // (자유 모드는 예외 — 언제든 리셋/재진입 가능해야 하므로 리포트로 안 보낸다.)
    if (done && !isFree()) { location.replace("report.html?set=" + SET); return; }
    // 게이트 화면 없이 바로 시작한다. 이어풀기든 새 응시든 엔진이 알아서
    // 판단하고(start), 아직 안 본 설명 화면부터 뜬다.
    if (!NEO_EXAMDB.supported()) {
      stage.innerHTML = "";
      var w = el("div", "gate");
      w.appendChild(el("h1", null, "This browser is not supported"));
      w.appendChild(el("p", "lead",
        "Local storage (IndexedDB) is required to take the test."));
      stage.appendChild(w);
      return;
    }
    NEO_EXAMDB.persist();
    fullscreenTip(function () { soundCheck(boot); });
  }).catch(function (e) {
    stage.innerHTML = "";
    var g = el("div", "gate");
    g.appendChild(el("h1", null, "Something went wrong"));
    g.appendChild(el("p", "lead", "Could not load the test data. (" + e + ")"));
    stage.appendChild(g);
  });
  });   // mockAllowed().then
})();
</script>
</body>
