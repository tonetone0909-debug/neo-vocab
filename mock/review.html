<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEO TOEFL · 영역 리뷰</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="stylesheet" href="../assets/colors_and_type.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/report.css">
<script src="assets/mobile-guard.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/shell.js"></script>
</head>
<body class="report-body">

<div class="app-topbar">
  <a class="brand" href="../index.html"><span class="n">NEO</span><span>TOEFL</span></a>
  <span class="crumb" id="hd-sec">REVIEW</span>
</div>

<main class="rv-wrap" id="rv"><div class="center-state">불러오는 중…</div></main>

<script src="assets/examdb.js"></script>
<script src="assets/score.js"></script>
<script src="assets/review.js"></script>
<script src="assets/render-r.js"></script>
<script src="assets/render-l.js"></script>
<script src="assets/feedback-io.js"></script>
<script>
(function () {
  "use strict";
  if (window.NEO_MOBILE && NEO_MOBILE.guard()) return;   // 폰이면 여기서 차단
  var R = window.NEO_REVIEW, el = R.el;
  var SET = parseInt(R.qparam("set") || "1", 10);
  var SEC = (R.qparam("sec") || "R").toUpperCase();
  var DEMO = R.qparam("demo") === "1";
  var host = document.getElementById("rv");
  var KO = { R: "Reading", L: "Listening", W: "Writing", S: "Speaking" };
  var exam, key, detail, FB = null;

  function hasFB(gid) { return !!(FB && FB[gid] && !FB[gid].error); }

  /* 태스크 클릭 → AI 첨삭 리포트(원 문제 + 내 답변 + 첨삭)를 새 창에. 첨삭 전이면 폴백. */
  function openTaskReport(gid, fallback) {
    if (hasFB(gid) && window.NEO_FBIO) NEO_FBIO.openReport(exam, gid, FB[gid], R.code(), SET);
    else if (fallback) fallback();
  }

  /* Writing/Speaking 리뷰의 태스크 버튼(점수·화살표·클릭) 공용 빌더. */
  function taskReviewBtn(label, gid, fallback) {
    var b = el("button", "rp-rv"), f = hasFB(gid);
    b.appendChild(el("span", "rp-rv-ko", label + (f ? "  ·  " + FB[gid].score_0_5.toFixed(1) + "/5" : "")));
    b.appendChild(el("span", "rp-rv-go", f ? "첨삭 →" : "→"));
    b.addEventListener("click", function () { openTaskReport(gid, fallback); });
    return b;
  }

  document.getElementById("hd-sec").textContent = (KO[SEC] || "REVIEW").toUpperCase();

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = function () { rej(src); };
      document.head.appendChild(s);
    });
  }

  function backLink(txt, fn) {
    var b = el("button", "rv-back", txt);
    b.addEventListener("click", fn);
    return b;
  }

  /* ═══ 목록 ═══════════════════════════════════════════════════ */

  function listView() {
    host.textContent = "";
    var a = el("a", "rv-back", "← 리포트로");
    a.href = "report.html?set=" + SET + (DEMO ? "&demo=1" : "");
    host.appendChild(a);
    host.appendChild(el("h1", "rp-h2", KO[SEC] + " 리뷰"));

    if (SEC === "R" || SEC === "L") return listRL();
    if (SEC === "W") return listW();
    return listS();
  }

  function grid(rows, onPick) {
    var g = el("div", "rv-grid");
    rows.forEach(function (row) {
      var c = el("button", "rv-cell " + (row.ok ? "ok" : "no"));
      c.appendChild(el("span", "rv-n", row.n));
      c.appendChild(el("span", "rv-v", row.ok ? "CORRECT" : "INCORRECT"));
      c.addEventListener("click", function () { onPick(row); });
      g.appendChild(c);
    });
    return g;
  }

  function modBlock(ko, sub, rows, onPick) {
    var box = el("div", "rv-mod");
    var h = el("div", "rv-mod-head");
    h.appendChild(el("span", "rv-mod-ko", ko));
    h.appendChild(el("span", "rv-mod-n", sub));
    box.appendChild(h);
    box.appendChild(grid(rows, onPick));
    return box;
  }

  function listRL() {
    var rows = R.sectionRows(SEC, detail.result, exam);
    var s1 = rows.filter(function (r) { return r.module === "router"; });
    var s2 = rows.filter(function (r) { return r.module !== "router"; });
    var up = detail.result[SEC].path === "upper";
    host.appendChild(modBlock("Stage 1", s1.length + "문항 · " +
      s1.filter(function (r) { return r.ok; }).length + " 정답", s1, detailView));
    host.appendChild(modBlock("Stage 2 · " + (up ? "상위" : "하위") + " 모듈",
      s2.length + "문항 · " + s2.filter(function (r) { return r.ok; }).length +
      " 정답", s2, detailView));
  }

  function listW() {
    var gid = exam.sections.W.groups[0];              // bas
    var g = exam.groups[gid];
    var marks = detail.result.W.marks || "";
    var rows = g.items.map(function (it, i) {
      return { n: i + 1, qid: it.id, gid: gid, ok: marks.charAt(i) === "1", module: "bas" };
    });
    host.appendChild(modBlock("Task 1 · Build a Sentence",
      rows.length + "문항 · " + rows.filter(function (r) { return r.ok; }).length +
      " 정답", rows, function () { basView(gid); }));

    exam.sections.W.groups.slice(1).forEach(function (id, i) {
      var label = "Task " + (i + 2) + " · " +
        (exam.groups[id].t === "email" ? "Write an Email" : "Academic Discussion");
      host.appendChild(taskReviewBtn(label, id, function () { essayView(id, i + 2); }));
    });
  }

  function listS() {
    exam.sections.S.groups.forEach(function (gid, gi) {
      var g = exam.groups[gid];
      var label = "Task " + (gi + 1) + " · " +
        (g.t === "repeat" ? "Listen and Repeat" : "Take an Interview");
      host.appendChild(taskReviewBtn(label, gid, function () { speakFallback(gid, gi + 1); }));
    });
    if (!FB) host.appendChild(el("p", "rv-pending",
      "AI 첨삭이 준비되면 태스크를 눌러 점수·피드백과 내 녹음을 볼 수 있어요."));
  }

  /* 첨삭 전 폴백 — 태스크의 문항별 녹음만 나열. */
  function speakFallback(gid, taskNo) {
    var g = exam.groups[gid], k = key.g[gid];
    detailShell("Speaking Task " + taskNo, null);
    var box = el("div", "rv-essay");
    g.items.forEach(function (it) {
      box.appendChild(el("div", "rv-k", (g.t === "repeat" ? "문장 " : "질문 ") + it.n));
      var target = (k.items || []).filter(function (x) { return x.n === it.n; })[0];
      box.appendChild(el("div", "rv-target", target ? target.text : ""));
      var audio = el("audio", "rv-audio"); audio.controls = true; box.appendChild(audio);
      NEO_EXAMDB.getRec(R.code(), SET, g.src + "_" + it.n).then(function (rec) {
        if (rec && rec.blob) audio.src = URL.createObjectURL(rec.blob); else audio.remove();
      }).catch(function () { audio.remove(); });
    });
    host.appendChild(box);
    host.appendChild(el("p", "rv-pending", "AI 첨삭이 들어오면 태스크를 눌러 피드백을 볼 수 있어요."));
  }

  /* ═══ 상세 ═══════════════════════════════════════════════════ */

  function detailShell(title, ok) {
    host.textContent = "";
    host.appendChild(backLink("← 목록으로", listView));
    var bar = el("div", "rv-bar");
    bar.appendChild(el("span", "rv-mod-ko", title));
    if (ok !== null) {
      bar.appendChild(el("span", "rv-verdict " + (ok ? "ok" : "no"),
                         ok ? "CORRECT" : "INCORRECT"));
    }
    host.appendChild(bar);
    return host;
  }

  /* R / L — 렌더러를 그대로 재사용하고 정오만 덧칠한다.
   * ctx.played 를 채워 넣기 때문에 Listening 도 오디오를 만들지 않는다. */
  function detailView(row) {
    detailShell(KO[SEC] + " " + row.n + "번", row.ok);
    var gid = row.gid;
    var qi = R.indexInGroup(row.qid, gid, exam);
    var stage = el("div", "reviewing");
    host.appendChild(stage);

    var g = exam.groups[gid];
    var fn = window.NEO_RENDER[g.t];
    if (!fn) {
      stage.appendChild(el("p", "rv-body", "이 유형은 아직 리뷰를 지원하지 않아요."));
      return;
    }
    fn(stage, R.reviewCtx(gid, qi, exam, detail));
    R.paintAnswers(stage, gid, detail, key, exam);

    // 해석 -> 해설 -> 영어 스크립트 순. 셋 다 눌러야 열린다.
    var tr = R.transBlock(gid, row.qid, key, exam, detail);
    if (tr) host.appendChild(tr);
    var ex = R.explainBlock(gid, row.qid, key);
    if (ex) host.appendChild(ex);
    var sc = R.scriptBlock(gid, key);
    if (sc) host.appendChild(sc);
  }

  /* W Task1 — 렌더러를 재사용하지 않는다.
   * basItem() 이 타일을 다시 섞어버려(shuffled) 리뷰에서 의미가 없다.
   * 학생 답과 정답을 나란히 놓는 정적 표가 목적에 맞다. */
  function basView(gid) {
    detailShell("Writing Task 1 · Build a Sentence", null);
    var g = exam.groups[gid], k = key.g[gid];
    var krItems = (k.kr && k.kr.items) || [];
    var norm = function (t) { return String(t == null ? "" : t).trim().toLowerCase(); };
    var box = el("div", "rv-essay");
    g.items.forEach(function (it, i) {
      var ki = k.items[i] || {};
      var placed = detail.answers[it.id] || [];
      var solution = ki.solution || [];
      var card = el("div", "rv-bas-card");
      card.appendChild(el("div", "rv-bas-q", (i + 1) + ". " + it.prompt));

      // 내 답안 = 문제 화면처럼 frame 에 내가 놓은 타일을 채우고, 슬롯별 정오 색
      var sent = el("div", "rv-bas-sentence");
      var parts = String(it.frame || "").split("____");
      var si = 0;
      parts.forEach(function (txt, pi) {
        if (txt) sent.appendChild(document.createTextNode(txt));
        if (pi < parts.length - 1) {
          var mine = placed[si];
          var okSlot = norm(mine) === norm(solution[si]);
          sent.appendChild(el("span", "rv-tile " + (okSlot ? "tile-ok" : "tile-no"),
            (mine == null || mine === "") ? "＿" : mine));
          si++;
        }
      });
      card.appendChild(sent);

      // 정답 full
      card.appendChild(el("div", "rv-bas-answer", ki.answer || solution.join(" ")));

      // 해설 + 해석 (인라인, 항상 표시)
      var kr = krItems[i];
      if (kr) {
        if (kr.note) {
          card.appendChild(el("div", "rv-k", "문법·표현"));
          card.appendChild(R.richP("rv-body", kr.note));
        }
        if (kr.prompt_ko) {
          card.appendChild(el("div", "rv-k", "질문 해석"));
          card.appendChild(el("p", "rv-body", kr.prompt_ko));
        }
        if (kr.answer_ko) {
          card.appendChild(el("div", "rv-k", "정답 해석"));
          card.appendChild(el("p", "rv-body", kr.answer_ko));
        }
      }
      box.appendChild(card);
    });
    host.appendChild(box);
  }

  /* W Task2·3 — 학생 원문. AI 첨삭이 들어오면 그 아래에 붙는다. */
  function essayView(gid, taskNo) {
    var g = exam.groups[gid];
    detailShell("Writing Task " + taskNo, null);
    var qid = g.src + "_" + (g.t === "email" ? "email" : "disc");
    var text = detail.answers[qid] || "";

    var box = el("div", "rv-essay");
    var head = el("div", "rv-essay-head");
    head.appendChild(el("span", "rv-essay-ko", "내가 쓴 글"));
    head.appendChild(el("span", "rv-essay-wc",
      (text.trim() ? text.trim().split(/\s+/).length : 0) + " words"));
    box.appendChild(head);
    box.appendChild(el("div", "rv-essay-text", text || "(답하지 않음)"));
    host.appendChild(box);

    // 정적 해설·해석 (프롬프트 번역 + 접근법). AI 첨삭과 별개.
    var kr = key.g[gid] && key.g[gid].kr;
    if (kr) host.appendChild(writingGuide(g, kr));

    var fb = key.g[gid] && key.g[gid].model;
    if (fb && String(fb).trim()) {
      var f = el("div", "rv-explain");
      f.appendChild(el("div", "rv-k", "첨삭"));
      f.appendChild(el("p", "rv-body", fb));
      host.appendChild(f);
    } else {
      host.appendChild(el("p", "rv-pending",
        "AI 첨삭이 아직 없어요. 첨삭이 들어오면 여기에 점수와 피드백이 표시돼요."));
    }
  }

  /* W Task2·3 — 프롬프트 해석만 제공(실제 첨삭은 AI 리포트가 담당). */
  function writingGuide(g, kr) {
    return R.foldable("프롬프트 해석 보기", function (b) {
      if (g.t === "email") {
        if (kr.situation_ko) {
          b.appendChild(el("div", "rv-k", "상황 해석"));
          b.appendChild(el("p", "rv-body", kr.situation_ko));
        }
        if ((kr.directions_ko || []).length) {
          b.appendChild(el("div", "rv-k", "지시 해석"));
          var dl = el("ul", "rv-optkr");
          kr.directions_ko.forEach(function (d) { dl.appendChild(el("li", null, d)); });
          b.appendChild(dl);
        }
      } else {  // disc
        if (kr.prof_ko) {
          b.appendChild(el("div", "rv-k", "교수 질문 해석"));
          b.appendChild(el("p", "rv-body", kr.prof_ko));
        }
        (kr.posts_ko || []).forEach(function (p) {
          b.appendChild(el("div", "rv-k", (p.name || "학생") + " 의견 해석"));
          b.appendChild(el("p", "rv-body", p.text_ko || p.text || ""));
        });
      }
    });
  }

  /* ═══ 시작 ═══════════════════════════════════════════════════ */
  Promise.all([
    loadScript("data/mk" + SET + "_exam.js"),
    loadScript("data/mk" + SET + "_key.js")
  ]).then(function () {
    exam = window["NEO_DATA_MK" + SET + "_EXAM"];
    key = window["NEO_DATA_MK" + SET + "_KEY"];
    if (DEMO) {
      var raw = sessionStorage.getItem("neo_mock_demo_" + SET);
      if (!raw) {
        host.textContent = "";
        var c = el("div", "center-state");
        c.appendChild(el("div", "big", "데모 데이터가 없어요"));
        var a = el("a", "btn", "리포트에서 다시 시작");
        a.href = "report.html?set=" + SET + "&demo=1";
        c.appendChild(a);
        host.appendChild(c);
        return;
      }
      detail = JSON.parse(raw);
      listView();
      return;
    }
    // 상세와 첨삭 캐시는 서로 독립이라 병렬로 읽는다(직렬 IndexedDB 왕복 1회 절약).
    return Promise.all([
      R.loadDetail(SET),
      (NEO_EXAMDB.getFeedback ? NEO_EXAMDB.getFeedback(R.code(), SET) : Promise.resolve(null))
        .catch(function () { return null; })
    ]).then(function (r) {
      if (!r[0]) { location.replace("report.html?set=" + SET); return; }
      detail = r[0];
      FB = r[1] && r[1].fb;
      listView();
    });
  }).catch(function (e) {
    host.textContent = "";
    host.appendChild(el("div", "center-state", "불러오지 못했어요: " + e));
  });
})();
</script>
</body>
</html>
